name: Publish HACS release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: node --check custom_components/ha_image_inspector/frontend/panel.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package the release
        run: |
          version=$(jq -r .version custom_components/ha_image_inspector/manifest.json)
          test "$GITHUB_REF_NAME" = "v$version"
          zip -r "ha_image_inspector-$version.zip" custom_components/ha_image_inspector
      - name: Publish the HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ha_image_inspector-*.zip --verify-tag --generate-notes --latest
