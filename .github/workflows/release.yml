name: Publish HACS release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install packaging==26.3
      - run: python -m unittest discover -s tests -v
      - run: node --input-type=module --check < custom_components/ha_image_inspector/frontend/panel.js
      - name: Analyze a local Docker image
        run: |
          work=$(mktemp -d)
          printf 'image fixture' > "$work/payload.txt"
          printf 'FROM scratch\nCOPY payload.txt /payload.txt\n' > "$work/Dockerfile"
          docker build --network=none --pull=false --tag image-inspector-fixture:ci "$work"
          docker image save --output "$work/fixture.tar" image-inspector-fixture:ci
          python custom_components/ha_image_inspector/analyzer.py --archive "$work/fixture.tar" > "$work/report.json"
          jq -e '.source == "local" and .totals.visible == 13' "$work/report.json"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package the release
        run: |
          version=$(jq -r .version custom_components/ha_image_inspector/manifest.json)
          test "$GITHUB_REF_NAME" = "v$version"
          zip -r "ha_image_inspector-$version.zip" custom_components/ha_image_inspector
      - name: Publish the HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ha_image_inspector-*.zip --verify-tag --generate-notes --latest
